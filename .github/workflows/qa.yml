name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: web-transition

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-transition/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  playwright:
    needs: unit
    runs-on: ubuntu-latest
    env:
      VITRINA_TOKEN: MTk3OTI4MTI3Mzc5
      HUBSPOT_USER_ID: '197928127379'
      PLAYWRIGHT_BASE_URL: https://visualizadorinmuebles.habitarinmobiliaria.co
      BACKEND_ORIGIN: https://backend-middleware-habitar-inmobiliaria-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-transition/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:api
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web-transition/playwright-report/
          retention-days: 7
